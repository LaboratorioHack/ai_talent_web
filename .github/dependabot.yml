# OWASP A03 (Software Supply Chain): automated, grouped dependency updates.
# The npm ecosystem covers pnpm (pnpm-lock.yaml). Dependabot PRs go through the same CI gate.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    groups:
      dependencies: { patterns: ["*"] }

  - package-ecosystem: docker
    directory: /
    schedule: { interval: weekly }

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions: { patterns: ["*"] }
