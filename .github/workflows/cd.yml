# CD = package + deploy. Runs ONLY on push to main (after PR merge).
# Does NOT re-run lint/tests: the PR already passed `ci-ok` (required by branch protection).
name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cd-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/laboratoriohack/ai-talent-web
  # Folder on the EC2 host (user-owned; no sudo needed). Override with repo variable DEPLOY_PATH.
  DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/home/ubuntu/ai-talent' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          # NEXT_PUBLIC_* are inlined at build time. They are public values: repo Variables are
          # preferred, but the repo currently stores them as Secrets, so fall back to those.
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL || secrets.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_SUPABASE_URL=${{ vars.NEXT_PUBLIC_SUPABASE_URL || secrets.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY || secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Pull & restart web
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd "${{ env.DEPLOY_PATH }}"   # docker-compose.yml is deployed by ai_talent_back
            if [ ! -f docker-compose.yml ]; then echo "ERROR: run the ai_talent_back CD first"; exit 1; fi
            if [ ! -f .env ]; then echo "ERROR: $PWD/.env not found"; exit 1; fi
            # The job token expires with the job; never leave it stored on the server.
            trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            docker compose pull web
            docker compose up -d --no-deps web
            docker image prune -f
